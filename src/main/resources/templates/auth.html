<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
	<head hx-head="append">
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>AZIT</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" th:href="@{/css/common.css}" />
		<link rel="stylesheet" th:href="@{/css/auth.css}" />
		<script
			src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
			integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
			crossorigin="anonymous"
		></script>
	</head>
	<body class="page-auth">
		<section class="auth-hero">
			<a class="logo" th:href="@{/}">AZIT</a>
		</section>

		<dialog id="modal-auth" class="card auth-card modal" th:fragment="modal">
			<button
				type="button"
				class="modal-close"
				onclick="this.closest('dialog').close()"
				aria-label="닫기"
			>
				<span class="modal-close-icon icon icon-x"></span>
			</button>

			<section
				id="auth-login"
				class="auth-section"
				th:classappend="${view == 'login'} ? 'active'"
			>
				<h2 class="auth-card-title">로그인</h2>
				<p class="auth-card-hint">AZIT 계정으로 계속 진행합니다.</p>
				<form th:action="@{/login}" method="post" hx-boost="false">
					<div class="form-group">
						<label class="label" for="username">이메일</label>
						<input
							class="input"
							type="email"
							id="username"
							name="username"
							placeholder="example@email.com"
							required
						/>
					</div>
					<div class="form-group">
						<label class="label" for="password">비밀번호</label>
						<input
							class="input"
							type="password"
							id="password"
							name="password"
							required
						/>
					</div>
					<button type="submit" class="btn btn-primary" style="width: 100%">
						로그인
					</button>
					<div th:if="${param.error}" class="auth-alert">
						로그인 정보가 올바르지 않습니다.
					</div>
				</form>
				<p class="auth-card-footer">
					아직 회원이 아니신가요?
					<a
						href="#"
						onclick="
							authSwitch('register');
							return false;
						"
						>회원가입하기</a
					>
				</p>
			</section>

			<section
				id="auth-register"
				class="auth-section"
				th:classappend="${view == 'register'} ? 'active'"
			>
				<h2 class="auth-card-title">회원가입</h2>
				<p class="auth-card-hint">AZIT에서 사용할 기본 정보를 입력합니다.</p>
				<form th:action="@{/register}" method="post" hx-boost="false">
					<div class="form-group">
						<label class="label" for="email"
							>이메일 <span class="required-mark">*</span></label
						>
						<input
							class="input"
							type="email"
							id="email"
							name="email"
							placeholder="example@email.com"
							required
						/>
					</div>
					<div class="form-group">
						<label class="label" for="name"
							>이름 <span class="required-mark">*</span></label
						>
						<input
							class="input"
							type="text"
							id="name"
							name="name"
							placeholder="실명을 입력하세요"
							required
						/>
					</div>
					<div class="form-group">
						<label class="label" for="age"
							>나이 <span class="optional-mark">(선택)</span></label
						>
						<input
							class="input"
							type="number"
							id="age"
							name="age"
							placeholder="나이를 입력하세요"
						/>
					</div>
					<div class="form-group">
						<label class="label" for="bio"
							>자기소개 <span class="optional-mark">(선택)</span></label
						>
						<textarea
							class="input"
							id="bio"
							name="bio"
							rows="4"
							placeholder="간단한 자기소개를 입력하세요"
						></textarea>
						<p class="field-help">
							프로필 화면에서 언제든지 수정할 수 있습니다.
						</p>
					</div>
					<div class="form-group">
						<label class="label" for="reg-password"
							>비밀번호 <span class="required-mark">*</span></label
						>
						<input
							class="input"
							type="password"
							id="reg-password"
							name="password"
							required
						/>
					</div>
					<button type="submit" class="btn btn-primary" style="width: 100%">
						회원가입
					</button>
				</form>
				<p class="auth-card-footer">
					이미 계정이 있으신가요?
					<a
						href="#"
						onclick="
							authSwitch('login');
							return false;
						"
						>로그인하기</a
					>
				</p>
			</section>

			<script>
				function authSwitch(view, push = true) {
					document
						.querySelectorAll('#modal-auth .auth-section')
						.forEach((s) => s.classList.remove('active'));
					document.getElementById('auth-' + view)?.classList.add('active');
					const onAuthPage =
						location.pathname === '/login' ||
						location.pathname === '/register';
					if (push && onAuthPage) history.pushState({ view }, '', '/' + view);
					const d = document.getElementById('modal-auth');
					if (d && !d.open && !d.closest('.page-auth')) d.showModal();
				}

				window.addEventListener('popstate', function (e) {
					const view =
						e.state?.view ??
						(location.pathname === '/register'
							? 'register'
							: location.pathname === '/login'
								? 'login'
								: null);
					if (!view) return;
					authSwitch(view, false);
				});

				(function openModal() {
					const d = document.getElementById('modal-auth');
					if (!d.querySelector('.auth-section.active')) return;
					d.closest('.page-auth') ? d.setAttribute('open', '') : d.showModal();
				})();
			</script>
		</dialog>
	</body>
</html>
