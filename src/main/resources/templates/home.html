<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Azit</title>
    <link rel="stylesheet" href="/css/azit.css" />
  </head>
  <body class="azit-app">
    <header class="azit-nav">
      <div class="azit-shell azit-nav-inner">
        <a class="azit-brand" href="/">
          <span class="azit-brand-mark">AZ</span>
          <span>Azit</span>
        </a>
        <div class="azit-nav-actions" th:if="${nickname != null}">
          <span class="azit-nav-user" th:text="${nickname}">Member</span>
          <a href="/profile/me" class="azit-button azit-button-secondary"
            >내 프로필</a
          >
          <form th:action="@{/logout}" method="post">
            <button type="submit" class="azit-button azit-button-danger">
              로그아웃
            </button>
          </form>
        </div>
        <div class="azit-nav-actions" th:if="${nickname == null}">
          <a href="/login" class="azit-button azit-button-secondary">로그인</a>
          <a href="/register" class="azit-button">회원가입</a>
        </div>
      </div>
    </header>

    <main class="azit-shell azit-hero">
      <section class="azit-hero-copy">
        <div class="azit-kicker">팀 빌딩과 구직 프로필을 한 곳에서</div>
        <h1>함께 일할 사람을 더 정확하게 찾는 공간</h1>
        <p>
          Azit은 기술 스택, 경력, 가능 시간대를 기반으로 팀원을 탐색하고
          프로필을 관리하는 협업 매칭 플랫폼입니다.
        </p>
        <div class="azit-nav-actions" style="margin-top: 28px">
          <a
            th:if="${nickname != null}"
            href="/profile/me"
            class="azit-button"
            >내 프로필 관리</a
          >
          <a
            th:if="${nickname == null}"
            href="/register"
            class="azit-button"
            >프로필 만들기</a
          >
          <a
            th:if="${nickname == null}"
            href="/login"
            class="azit-button azit-button-secondary"
            >로그인</a
          >
        </div>
      </section>

      <aside class="azit-panel azit-panel-pad">
        <div class="azit-kicker">Profile Snapshot</div>
        <h2 style="margin: 0; font-size: 2rem; font-weight: 900">
          검증된 정보로 팀 매칭을 시작하세요
        </h2>
        <p style="color: var(--azit-muted); line-height: 1.7">
          기술 스택, 포트폴리오 링크, 활동 가능 시간대를 한 화면에서 정리해
          팀원이 빠르게 판단할 수 있게 합니다.
        </p>
        <div class="azit-form-section" style="margin-top: 24px">
          <strong>현재 제공 기능</strong>
          <div style="margin-top: 14px">
            <span class="azit-stack-badge">프로필</span>
            <span class="azit-stack-badge">기술 스택</span>
            <span class="azit-stack-badge">경력</span>
            <span class="azit-stack-badge">가능 시간</span>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
