<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>초대 목록 | Azit</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="stylesheet" href="/css/common.css" />
	<link rel="stylesheet" href="/css/sidebar.css" />
	<link rel="stylesheet" href="/css/azit.css" />
</head>

<body class="azit-app has-sidebar">
	<div th:replace="~{fragments/sidebar :: sidebar}"></div>

	<main class="azit-shell azit-page">
		<section class="azit-page-heading">
			<div>
				<div class="azit-kicker">Invitations</div>
				<h1>받은 초대</h1>
				<p>프로젝트 초대를 확인하고 참여 여부를 선택하세요.</p>
			</div>
		</section>

		<p class="azit-alert" th:if="${errorMessage}" th:text="${errorMessage}" style="margin-bottom: 16px"></p>
		<p class="azit-alert-success" th:if="${successMessage}" th:text="${successMessage}" style="margin-bottom: 16px">
		</p>

		<section class="azit-card">
			<div class="azit-card-header">초대 목록</div>
			<div class="azit-card-body">
				<div th:if="${pendingInvitations != null and !pendingInvitations.isEmpty()}"
					style="display: grid; gap: 12px">
					<div class="azit-form-section" th:each="invitation : ${pendingInvitations}">
						<div style="
									display: flex;
									align-items: center;
									gap: 10px;
									flex-wrap: wrap;
								">
							<strong th:text="${invitation.project.title}">프로젝트 이름</strong>
							<span class="azit-status-badge" th:classappend="${invitation.project.status.cssClass}"
								th:text="${invitation.project.status.label}">
								진행중
							</span>
						</div>
						<p class="azit-empty" style="margin-top: 8px" th:if="${invitation.project.description != null
       and !#strings.isEmpty(#strings.trim(invitation.project.description))
       and #strings.trim(invitation.project.description) != '.'}" th:text="${invitation.project.description}">
							프로젝트 설명
						</p>
						<p class="azit-empty" style="margin-top: 6px"
							th:text="${invitation.sender.name + '(' + invitation.sender.email + ')님이 초대했습니다.'}">
							초대한 사람(이메일)님이 초대했습니다.
						</p>

						<div style="
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        ">
							<button type="submit" class="azit-button"
								th:disabled="${invitation.project.status.name() != 'IN_PROGRESS'}"
								th:classappend="${invitation.project.status.name() != 'IN_PROGRESS'} ? ' azit-button-disabled' : ''">
								수락
							</button>
							<form th:action="@{/invitations/{id}/reject(id=${invitation.id})}" method="post">
								<button type="submit" class="azit-button azit-button-danger">
									거절
								</button>
							</form>
							<a class="azit-button azit-button-secondary"
								th:href="@{/invitations/{id}(id=${invitation.id})}">
								상세 보기
							</a>
						</div>
					</div>
				</div>

				<p class="azit-empty" th:if="${pendingInvitations == null or pendingInvitations.isEmpty()}">
					받은 초대가 없습니다.
				</p>
			</div>
		</section>
	</main>
</body>

</html>
