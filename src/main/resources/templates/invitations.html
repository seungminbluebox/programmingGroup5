<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>초대 목록 | Azit</title>
    <link rel="stylesheet" href="/css/azit.css" />
  </head>
  <body class="azit-app">
    <header class="azit-nav">
      <div class="azit-shell azit-nav-inner">
        <a class="azit-brand" href="/">
          <span class="azit-brand-mark">AZ</span>
          <span>Azit</span>
        </a>
        <div class="azit-nav-actions">
          <a href="/" class="azit-button azit-button-secondary">대시보드</a>
          <form th:action="@{/logout}" method="post">
            <button type="submit" class="azit-button azit-button-danger">로그아웃</button>
          </form>
        </div>
      </div>
    </header>

    <main class="azit-shell azit-page">
      <section class="azit-page-heading">
        <div>
          <div class="azit-kicker">Invitations</div>
          <h1>받은 초대</h1>
          <p>프로젝트 초대를 확인하고 참여 여부를 선택하세요.</p>
        </div>
      </section>

      <p class="azit-alert" th:if="${errorMessage}" th:text="${errorMessage}" style="margin-bottom: 16px"></p>

      <section class="azit-card">
        <div class="azit-card-header">초대 목록</div>
        <div class="azit-card-body">
          <div
            th:if="${pendingInvitations != null and !pendingInvitations.isEmpty()}"
            style="display: grid; gap: 12px"
          >
            <div class="azit-form-section" th:each="invitation : ${pendingInvitations}">
              <strong th:text="${invitation.project.title}">프로젝트 이름</strong>
              <p
                class="azit-empty"
                style="margin-top: 6px"
                th:text="${invitation.sender.name + '님이 초대했습니다.'}"
              >
                초대한 사람
              </p>

              <a
                class="azit-button"
                style="margin-top: 12px"
                th:href="@{/invitations/{id}(id=${invitation.id})}"
              >
                초대 확인
              </a>
            </div>
          </div>

          <p
            class="azit-empty"
            th:if="${pendingInvitations == null or pendingInvitations.isEmpty()}"
          >
            받은 초대가 없습니다.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
