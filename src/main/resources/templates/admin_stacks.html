<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>기술 스택 관리 - Azit</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/azit.css" />
  </head>
  <body class="azit-app">
    <header class="azit-nav">
      <div class="azit-shell azit-nav-inner">
        <a class="azit-brand" href="/">
          <span class="azit-brand-mark">AZ</span>
          <span>Azit Admin</span>
        </a>
        <div class="azit-nav-actions">
          <span class="azit-nav-user" th:text="${#authentication.name}"
            >AdminName</span
          >
          <a class="azit-button azit-button-secondary" href="/">사이트로 이동</a>
        </div>
      </div>
    </header>

    <main class="azit-shell azit-page">
      <section class="azit-page-heading">
        <div>
          <div class="azit-kicker">Admin Console</div>
          <h1>기술 스택 관리</h1>
          <p>프로필에서 선택할 수 있는 기술 스택과 아이콘을 관리합니다.</p>
        </div>
      </section>

      <section class="azit-card" style="margin-bottom: 24px">
        <div class="azit-card-header">새 기술 스택 추가</div>
        <div class="azit-card-body">
          <form
            th:action="@{/admin/stacks/add}"
            method="post"
            class="row gx-3 gy-3 align-items-end"
          >
            <div class="col-md-4">
              <label class="azit-form-label" for="stackName">스택 이름</label>
              <input
                type="text"
                class="form-control azit-input"
                id="stackName"
                name="stackName"
                placeholder="예: Java"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="azit-form-label" for="iconUrl">아이콘 URL</label>
              <input
                type="url"
                class="form-control azit-input"
                id="iconUrl"
                name="iconUrl"
                placeholder="이미지 URL"
              />
            </div>
            <div class="col-md-2">
              <button type="submit" class="azit-button" style="width: 100%">
                추가
              </button>
            </div>
          </form>
        </div>
      </section>

      <section class="azit-card">
        <div class="azit-card-header">
          <span>등록된 기술 스택</span>
          <span class="text-muted small" th:text="${#lists.size(stacks)} + '개'"
            >0개</span
          >
        </div>
        <div class="table-responsive">
          <table class="table align-middle azit-table">
            <thead>
              <tr>
                <th style="width: 10%">ID</th>
                <th style="width: 16%">아이콘</th>
                <th>스택 이름</th>
                <th style="width: 18%">관리</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="stack : ${stacks}">
                <td th:text="${stack.id}">1</td>
                <td>
                  <img
                    th:if="${stack.iconUrl != null}"
                    th:src="${stack.iconUrl}"
                    alt="icon"
                    style="width: 28px; height: 28px; object-fit: contain"
                  />
                  <span
                    th:unless="${stack.iconUrl != null}"
                    class="text-muted small"
                    >아이콘 없음</span
                  >
                </td>
                <td>
                  <strong th:text="${stack.stackName}">Java</strong>
                </td>
                <td>
                  <form
                    th:action="@{/admin/stacks/delete/{id}(id=${stack.id})}"
                    method="post"
                    onsubmit="return confirm('진짜 삭제하시겠습니까?');"
                  >
                    <button
                      type="submit"
                      class="azit-button azit-button-danger"
                      style="min-height: 36px; padding: 0 12px"
                    >
                      삭제
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(stacks)}">
                <td colspan="4" class="text-center text-muted">
                  등록된 기술 스택이 없습니다.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
