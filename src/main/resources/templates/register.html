<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>회원가입 - AZIT</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" th:href="@{/css/common.css}" />
		<link rel="stylesheet" th:href="@{/css/auth.css}" />
	</head>
	<body>
		<a class="logo" th:unless="${isModal}" th:href="@{/}">AZIT</a>

		<dialog id="modal-auth" class="auth-form-wrap card auth-card modal"
				th:attr="open=${isModal} ? null : 'open'">
			<button type="button" class="modal-close"
					onclick="this.closest('dialog').close()" aria-label="닫기"><span class="modal-close-icon"></span></button>
			<h2 class="auth-card-title">회원가입</h2>
			<p class="auth-card-hint">AZIT에서 사용할 기본 정보를 입력합니다.</p>
			<form th:action="@{/register}" method="post">
				<div class="form-group">
					<label class="label" for="email"
						>이메일 <span class="required-mark">*</span></label
					>
					<input
						class="input"
						type="email"
						id="email"
						name="email"
						placeholder="example@email.com"
						required
					/>
				</div>
				<div class="form-group">
					<label class="label" for="name"
						>이름 <span class="required-mark">*</span></label
					>
					<input
						class="input"
						type="text"
						id="name"
						name="name"
						placeholder="실명을 입력하세요"
						required
					/>
				</div>
				<div class="form-group">
					<label class="label" for="age"
						>나이 <span class="optional-mark">(선택)</span></label
					>
					<input
						class="input"
						type="number"
						id="age"
						name="age"
						placeholder="나이를 입력하세요"
					/>
				</div>
				<div class="form-group">
					<label class="label" for="bio"
						>자기소개 <span class="optional-mark">(선택)</span></label
					>
					<textarea
						class="input"
						id="bio"
						name="bio"
						rows="4"
						placeholder="간단한 자기소개를 입력하세요"
					></textarea>
					<p class="field-help">프로필 화면에서 언제든지 수정할 수 있습니다.</p>
				</div>
				<div class="form-group">
					<label class="label" for="password"
						>비밀번호 <span class="required-mark">*</span></label
					>
					<input
						class="input"
						type="password"
						id="password"
						name="password"
						required
					/>
				</div>
				<button type="submit" class="btn btn-primary" style="width: 100%">
					회원가입
				</button>
			</form>
			<p class="auth-card-footer">
				이미 계정이 있으신가요?
				<a th:href="@{/login}">로그인하기</a>
			</p>
		</dialog>
	</body>
</html>
