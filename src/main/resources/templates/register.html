<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입 - Azit</title>
    <link rel="stylesheet" href="/css/azit.css" />
  </head>
  <body class="azit-app">
    <main class="azit-auth-page">
      <section class="azit-auth-side">
        <a class="azit-brand" href="/">
          <span class="azit-brand-mark">AZ</span>
          <span>Azit</span>
        </a>
        <div style="margin-top: 56px">
          <div class="azit-kicker">Create Profile</div>
          <h1>팀원이 판단하기 쉬운 프로필을 만드세요</h1>
          <p>
            기본 정보를 먼저 등록한 뒤 프로필 화면에서 기술 스택, 경력, 가능
            시간대와 프로필 사진을 추가할 수 있습니다.
          </p>
        </div>
      </section>

      <section class="azit-auth-form-wrap">
        <div class="azit-panel azit-auth-card">
          <h2>회원가입</h2>
          <p class="hint">Azit에서 사용할 기본 정보를 입력합니다.</p>
          <form th:action="@{/register}" method="post">
            <div style="margin-bottom: 16px">
              <label class="azit-form-label" for="email">이메일</label>
              <input
                class="azit-input"
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                required
              />
            </div>
            <div style="margin-bottom: 16px">
              <label class="azit-form-label" for="name">이름</label>
              <input
                class="azit-input"
                type="text"
                id="name"
                name="name"
                placeholder="실명을 입력하세요"
                required
              />
            </div>
            <div style="margin-bottom: 16px">
              <label class="azit-form-label" for="age">나이</label>
              <input
                class="azit-input"
                type="number"
                id="age"
                name="age"
                placeholder="나이를 입력하세요"
              />
            </div>
            <div style="margin-bottom: 16px">
              <label class="azit-form-label" for="bio">자기소개</label>
              <textarea
                class="azit-input"
                id="bio"
                name="bio"
                rows="4"
                placeholder="간단한 자기소개를 입력하세요"
                style="width: 100%; padding: 12px"
              ></textarea>
            </div>
            <div style="margin-bottom: 18px">
              <label class="azit-form-label" for="password">비밀번호</label>
              <input
                class="azit-input"
                type="password"
                id="password"
                name="password"
                required
              />
            </div>
            <button type="submit" class="azit-button" style="width: 100%">
              회원가입 완료
            </button>
          </form>
          <p style="margin: 24px 0 0; text-align: center; color: var(--azit-muted)">
            이미 계정이 있으신가요?
            <a href="/login" style="font-weight: 800">로그인하기</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
