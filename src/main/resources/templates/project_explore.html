<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Azit - 시작하기</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/sidebar.css" />
    <link rel="stylesheet" href="/css/azit.css" />
    <style>
        .explore-page { padding: 40px 48px; max-width: 900px; }
        .explore-title { font-size: 1.75rem; font-weight: 800; color: #1a1a2e; margin-bottom: 6px; }
        .explore-subtitle { color: #6b7280; font-size: 0.95rem; margin-bottom: 32px; }

        .explore-cta { margin-bottom: 36px; }
        .explore-cta-label { font-size: 1.05rem; font-weight: 700; color: #6366f1; margin-bottom: 4px; }
        .explore-cta-desc { font-size: 0.88rem; color: #6b7280; margin-bottom: 14px; }

        .explore-search { position: relative; margin-bottom: 36px; }
        .explore-search input {
            width: 100%; padding: 14px 18px 14px 44px;
            border: 1.5px solid #e5e7eb; border-radius: 12px;
            font-size: 0.95rem; outline: none; background: #fff;
            box-sizing: border-box; font-family: inherit;
        }
        .explore-search input:focus { border-color: #6366f1; }
        .explore-search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #9ca3af; }

        .explore-section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .explore-section-title { font-size: 1rem; font-weight: 700; color: #1a1a2e; }

        .explore-tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
        .explore-tab {
            padding: 6px 16px; border-radius: 99px; font-size: 0.85rem; font-weight: 500;
            border: 1.5px solid #e5e7eb; background: #fff; cursor: pointer;
            color: #374151; transition: all 0.15s; text-decoration: none;
        }
        .explore-tab.active, .explore-tab:hover { background: #6366f1; color: #fff; border-color: #6366f1; }

        .project-list { display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; border: 1.5px solid #e5e7eb; background: #fff; }
        .project-list-item {
            display: flex; align-items: center; gap: 16px;
            padding: 20px 24px; border-bottom: 1px solid #f3f4f6;
            text-decoration: none; transition: background 0.1s; color: inherit;
        }
        .project-list-item:last-child { border-bottom: none; }
        .project-list-item:hover { background: #f8f9ff; }

        .project-list-icon {
            width: 52px; height: 52px; border-radius: 14px;
            background: linear-gradient(135deg, #e0e7ff, #c7d2fe);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 800; color: #6366f1;
            flex-shrink: 0;
        }
        .project-list-content { flex: 1; min-width: 0; }
        .project-list-name { font-size: 0.95rem; font-weight: 700; color: #1a1a2e; margin-bottom: 3px; }
        .project-list-desc { font-size: 0.82rem; color: #6b7280; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .project-list-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
        .project-list-tag { padding: 2px 8px; border-radius: 6px; background: #f3f4f6; font-size: 0.75rem; color: #374151; display: flex; align-items: center; gap: 4px; }
        .project-list-tag img { width: 12px; height: 12px; }
        .project-list-meta { font-size: 0.78rem; color: #9ca3af; }
        .project-list-meta .deadline { font-weight: 600; color: #ef4444; margin-left: 8px; }

        .project-list-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .member-avatars { display: flex; }
        .member-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: #6366f1; color: #fff; font-size: 0.72rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #fff; margin-left: -6px;
        }
        .member-avatar:first-child { margin-left: 0; }

        .project-empty { text-align: center; padding: 60px 24px; color: #9ca3af; }
        .project-empty-title { font-size: 1rem; font-weight: 600; color: #374151; margin-bottom: 8px; }

        .new-project-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: #6366f1; color: #fff; padding: 11px 22px;
            border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.9rem;
            transition: background 0.15s;
        }
        .new-project-btn:hover { background: #4f46e5; }
    </style>
</head>
<body class="azit-app has-sidebar">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="explore-page">
        <h1 class="explore-title">함께 만들 팀을 찾아보세요 🚀</h1>
        <p class="explore-subtitle">아이디어를 실현할 팀원을 찾고, 함께 멋진 프로젝트를 만들어보세요.</p>

        <div class="explore-cta">
            <div class="explore-cta-label">무엇을 만들고 싶나요?</div>
            <div class="explore-cta-desc">먼저 비슷한 프로젝트를 찾아보세요. 없으면 새로 만들 수 있어요. 🌱</div>
        </div>

        <div class="explore-search">
            <span class="explore-search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="예) AI 여행 플래너, 반려동물 케어 앱, 공부 관리 서비스"
                   oninput="filterProjects(this.value)" />
        </div>

        <div class="explore-section-header">
            <div class="explore-section-title">참여 가능한 프로젝트</div>
            <a href="/projects/create" class="new-project-btn">
                ✨ 새 프로젝트 만들기
            </a>
        </div>

        <div class="explore-tabs">
            <a href="#" class="explore-tab active" onclick="filterByStack('', this); return false;">전체</a>
            <a href="#" class="explore-tab" onclick="filterByStack('React', this); return false;">React</a>
            <a href="#" class="explore-tab" onclick="filterByStack('Node.js', this); return false;">Node.js</a>
            <a href="#" class="explore-tab" onclick="filterByStack('TypeScript', this); return false;">TypeScript</a>
            <a href="#" class="explore-tab" onclick="filterByStack('Python', this); return false;">Python</a>
            <a href="#" class="explore-tab" onclick="filterByStack('Spring Boot', this); return false;">Spring Boot</a>
            <a href="#" class="explore-tab" onclick="filterByStack('Vue.js', this); return false;">Vue.js</a>
        </div>

        <div class="project-list" id="projectList">
            <th:block th:if="${publicProjects != null and !#lists.isEmpty(publicProjects)}">
                <a class="project-list-item"
                   th:each="project : ${publicProjects}"
                   th:href="@{/project/{id}(id=${project.id})}"
                   th:data-title="${project.title}"
                   th:data-desc="${project.description}"
                   th:data-stacks="${#strings.listJoin(project.stacks.![techStack.stackName], ',')}">

                    <!-- 아이콘 (제목 첫 글자) -->
                    <div class="project-list-icon"
                         th:text="${#strings.substring(project.title, 0, 1)}">A</div>

                    <!-- 내용 -->
                    <div class="project-list-content">
                        <div class="project-list-name" th:text="${project.title}"></div>
                        <div class="project-list-desc" th:text="${project.description}"></div>
                        <div class="project-list-tags">
                            <span class="project-list-tag"
                                  th:each="stack, stat : ${project.stacks}"
                                  th:if="${stat.index < 3}">
                                <img th:src="${stack.techStack.iconUrl}"
                                     th:alt="${stack.techStack.stackName}"
                                     onerror="this.style.display='none'" />
                                <span th:text="${stack.techStack.stackName}"></span>
                            </span>
                            <span class="project-list-tag"
                                  th:if="${#lists.size(project.stacks) > 3}"
                                  th:text="'+' + (${#lists.size(project.stacks)} - 3)"
                                  style="background:#e0e7ff;color:#6366f1;"></span>
                        </div>
                        <div class="project-list-meta">
                            <span th:text="${#lists.size(project.members)} + '명 참여 중'"></span>
                            <span class="deadline"
                                  th:if="${project.deadline != null}"
                                  th:text="'D-' + ${#temporals.daysBetween(#temporals.createToday(), project.deadline)}"></span>
                        </div>
                    </div>

                    <!-- 오른쪽: 멤버 아바타 -->
                    <div class="project-list-right">
                        <div class="member-avatars">
                            <div class="member-avatar"
                                 th:each="pm, stat : ${project.members}"
                                 th:if="${stat.index < 3}"
                                 th:text="${#strings.substring(pm.member.name, 0, 1)}"
                                 th:style="'background:' + (${stat.index} == 0 ? '#6366f1' : (${stat.index} == 1 ? '#8b5cf6' : '#06b6d4')) + ';'">
                            </div>
                        </div>
                    </div>
                </a>
            </th:block>

            <!-- 프로젝트 없을 때 -->
            <div class="project-empty" th:if="${publicProjects == null or #lists.isEmpty(publicProjects)}">
                <div class="project-empty-title">아직 참여 가능한 프로젝트가 없어요</div>
                <p style="font-size:0.85rem;margin-bottom:20px;">첫 번째 프로젝트를 만들어보세요!</p>
                <a href="/projects/create" class="new-project-btn">✨ 새 프로젝트 만들기</a>
            </div>
        </div>
    </main>

    <script>
        function filterProjects(query) {
            const q = query.toLowerCase();
            document.querySelectorAll('.project-list-item').forEach(item => {
                const title = (item.dataset.title || '').toLowerCase();
                const desc = (item.dataset.desc || '').toLowerCase();
                const stacks = (item.dataset.stacks || '').toLowerCase();
                item.style.display = (title.includes(q) || desc.includes(q) || stacks.includes(q)) ? '' : 'none';
            });
        }

        function filterByStack(stack, el) {
            document.querySelectorAll('.explore-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.project-list-item').forEach(item => {
                if (!stack) {
                    item.style.display = '';
                } else {
                    const stacks = (item.dataset.stacks || '').toLowerCase();
                    item.style.display = stacks.includes(stack.toLowerCase()) ? '' : 'none';
                }
            });
        }
    </script>
</body>
</html>
