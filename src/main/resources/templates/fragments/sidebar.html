<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AZIT</title>
		<link
			rel="stylesheet"
			href="/src/main/resources/static/css/common.css"
			th:href="@{/css/common.css}"
		/>
		<link
			th:fragment="stylesheet"
			rel="stylesheet"
			href="/src/main/resources/static/css/fragments/sidebar.css"
			th:href="@{/css/fragments/sidebar.css}"
		/>
	</head>
	<body>
		<header id="sidebar" th:fragment="sidebar">
			<div id="sidebar-header">
				<div>
					<a id="sidebar-home" class="logo" th:href="@{/}">AZIT</a>
				</div>
				<div>
					<button
						id="sidebar-notification"
						type="button"
						aria-label="알림 목록"
						data-notification-open
					>
						<span class="notification-badge" th:if="${sidebarNotificationCount > 0}" th:text="${sidebarNotificationCount}">1</span>
					</button>
				</div>
			</div>
			<nav id="sidebar-menu">
				<ul>
					<li>
						<a
							id="sidebar-dashboard"
							class="sidebar-page"
							th:href="@{/}"
							th:classappend="${currentPath == '/'} ? 'active'"
						>
							<div class="sidebar-page-icon"></div>
							<div class="sidebar-page-name">대시보드</div>
						</a>
					</li>
					<li>
						<a
							id="sidebar-start"
							class="sidebar-page"
							th:href="@{/main}"
							th:classappend="${currentPath == '/main'} ? 'active'"
						>
							<div class="sidebar-page-icon"></div>
							<div class="sidebar-page-name">시작하기</div>
						</a>
					</li>
					<li>
						<a
							id="sidebar-task"
							class="sidebar-page"
							th:href="@{/}"
							th:classappend="${currentPath == '/'} ? 'active'"
						>
							<div class="sidebar-page-icon"></div>
							<div class="sidebar-page-name">할 일</div>
						</a>
					</li>
					<li>
						<a
							id="sidebar-schedule"
							class="sidebar-page"
							th:href="@{/schedule}"
							th:classappend="${currentPath == '/schedule'} ? 'active'"
						>
							<div class="sidebar-page-icon"></div>
							<div class="sidebar-page-name">일정</div>
						</a>
					</li>
				</ul>
			</nav>
			<nav id="sidebar-projects" th:if="${sidebarMemberName != null}">
				<h2>내 프로젝트</h2>
				<ul>
					<li th:each="project: ${sidebarProjects}">
						<a
							class="sidebar-project"
							th:href="@{/project/{projectId}(projectId=${project.id})}"
							th:classappend="${currentPath == #strings.concat('/project/', project.id)} ? 'active'"
						>
							<div class="sidebar-project-icon"></div>
							<div
								class="sidebar-project-name"
								th:text="${project.title}"
							></div>
						</a>
					</li>
				</ul>
			</nav>
			<nav id="sidebar-footer">
				<ul>
					<li id="sidebar-user">
						<a
							id="sidebar-userpage"
							th:if="${sidebarMemberName != null}"
							th:text="${sidebarMemberName}"
							th:href="@{/profile/me}"
							th:classappend="${currentPath == '/profile/me'} ? 'active'"
						></a>
						<a
							id="sidebar-login"
							th:unless="${sidebarMemberName != null}"
							th:href="@{/login}"
							th:classappend="${currentPath == '/login'} ? 'active'"
							>로그인</a
						>
						<input
							id="sidebar-usermenu-toggle-input"
							class="toggle-input"
							type="checkbox"
						/>
						<label
							id="sidebar-usermenu-toggle-button"
							class="toggle-button"
							for="sidebar-usermenu-toggle-input"
							th:if="${sidebarMemberName != null}"
						></label>
						<nav id="sidebar-usermenu">
							<ul>
								<li th:unless="${sidebarMemberName != null}">
									<a id="sidebar-register" th:href="@{/register}">
										<div class="sidebar-usermenu-icon"></div>
										<div class="sidebar-usermenu-label">회원가입</div>
									</a>
								</li>
								<li th:if="${sidebarMemberName != null}">
									<form th:action="@{/logout}" method="POST">
										<button id="sidebar-logout" type="submit">
											<div class="sidebar-usermenu-icon"></div>
											<div class="sidebar-usermenu-label">
												로그아웃
											</div>
										</button>
									</form>
								</li>
							</ul>
						</nav>
					</li>
				</ul>
			</nav>
			<div id="notification-modal" class="notification-modal-backdrop" aria-hidden="true">
				<section class="notification-modal" role="dialog" aria-modal="true" aria-labelledby="notification-modal-title">
					<header class="notification-modal-header">
						<h2 id="notification-modal-title">알림</h2>
						<button type="button" class="notification-modal-close" data-notification-close aria-label="닫기">X</button>
					</header>
					<div class="notification-modal-body">
						<section>
							<h3>받은 초대</h3>
							<div class="notification-list" th:if="${sidebarPendingInvitations != null and !sidebarPendingInvitations.isEmpty()}">
								<article class="notification-item" th:each="invitation : ${sidebarPendingInvitations}">
									<strong th:text="${invitation.project.title}">프로젝트 이름</strong>
									<p th:text="${invitation.sender.name + '님이 초대했습니다.'}">초대한 사람</p>
									<div class="notification-actions">
										<form th:action="@{/invitations/{id}/accept(id=${invitation.id})}" method="post">
											<button type="submit" class="azit-button">수락</button>
										</form>
										<form th:action="@{/invitations/{id}/reject(id=${invitation.id})}" method="post">
											<button type="submit" class="azit-button azit-button-danger">거절</button>
										</form>
									</div>
								</article>
							</div>
							<p class="notification-empty" th:if="${sidebarPendingInvitations == null or sidebarPendingInvitations.isEmpty()}">받은 초대가 없습니다.</p>
						</section>

						<section>
							<h3>가입신청</h3>
							<div class="notification-list" th:if="${sidebarPendingJoinRequests != null and !sidebarPendingJoinRequests.isEmpty()}">
								<article class="notification-item" th:each="joinRequest : ${sidebarPendingJoinRequests}">
									<strong th:text="${joinRequest.project.title}">프로젝트 이름</strong>
									<p>
										<a th:href="@{/profile/{id}(id=${joinRequest.applicant.id})}" th:text="${joinRequest.applicant.name}">신청자</a>
										<span>님이 가입신청했습니다.</span>
									</p>
									<div class="notification-actions">
										<form th:action="@{/join-requests/{id}/accept(id=${joinRequest.id})}" method="post">
											<button type="submit" class="azit-button">수락</button>
										</form>
										<form th:action="@{/join-requests/{id}/reject(id=${joinRequest.id})}" method="post">
											<button type="submit" class="azit-button azit-button-danger">거절</button>
										</form>
									</div>
								</article>
							</div>
							<p class="notification-empty" th:if="${sidebarPendingJoinRequests == null or sidebarPendingJoinRequests.isEmpty()}">가입신청이 없습니다.</p>
						</section>
					</div>
				</section>
			</div>
			<script>
				(() => {
					const modal = document.getElementById("notification-modal");
					const openButton = document.querySelector("[data-notification-open]");
					const closeButtons = document.querySelectorAll("[data-notification-close]");

					if (!modal || !openButton) {
						return;
					}

					function closeModal() {
						modal.classList.remove("open");
						modal.setAttribute("aria-hidden", "true");
					}

					openButton.addEventListener("click", () => {
						modal.classList.add("open");
						modal.setAttribute("aria-hidden", "false");
					});

					document.querySelectorAll(".notification-actions form").forEach((notificationForm) => {
						notificationForm.addEventListener("submit", () => {
							notificationForm.querySelectorAll("button").forEach((button) => {
								button.disabled = true;
							});
						});
					});

					closeButtons.forEach((button) => button.addEventListener("click", closeModal));
					modal.addEventListener("click", (event) => {
						if (event.target === modal) {
							closeModal();
						}
					});
				})();
			</script>
		</header>
		<main>
			<h1>본문</h1>
		</main>
	</body>
</html>
