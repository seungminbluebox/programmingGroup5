<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AZIT</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link
			rel="stylesheet"
			href="/src/main/resources/static/css/common.css"
			th:href="@{/css/common.css}"
		/>
		<link
			th:fragment="stylesheet"
			rel="stylesheet"
			href="/src/main/resources/static/css/sidebar.css"
			th:href="@{/css/sidebar.css}"
		/>
		<link rel="stylesheet" th:href="@{/css/auth.css}" />
		<script
			src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
			integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
			crossorigin="anonymous"
		></script>
		<script
			src="https://cdn.jsdelivr.net/npm/htmx-ext-head-support@2.0.5"
			integrity="sha384-cvMqHzjCJsOHgGuyB3sWXaUSv/Krm0BdzjuI1rtkjCbL1l1oHJx+cHyVRJhyuEz0"
			crossorigin="anonymous"
		></script>
		<script
			src="https://cdn.jsdelivr.net/npm/htmx-ext-route-layout@0.1.4/dist/index.min.js"
			integrity="sha256-X7Tg/54td+irTN7upx+rWIRXE/pBynhrmfsJn7Da/Eo="
			crossorigin="anonymous"
		></script>
	</head>
	<body>
		<header id="sidebar" th:fragment="sidebar" hx-ext="head-support">
			<div id="sidebar-header">
				<div>
					<a id="sidebar-home" class="logo" th:href="@{/}">AZIT</a>
				</div>
				<div>
					<a
						id="sidebar-notification"
						class="icon icon-bell"
						th:href="@{/invitations}"
						aria-label="초대 목록"
					></a>
				</div>
			</div>
			<nav id="sidebar-menu">
				<ul>
					<li>
						<a
							id="sidebar-dashboard"
							class="sidebar-page"
							th:href="@{/}"
							th:classappend="${currentPath == '/'} ? 'active'"
						>
							<div class="sidebar-page-icon icon icon-layout-dashboard"></div>
							<div class="sidebar-page-name">대시보드</div>
						</a>
					</li>
					<li>
						<a
							id="sidebar-start"
							class="sidebar-page"
							th:href="@{/}"
							th:classappend="${currentPath == '/'} ? 'active'"
						>
							<div class="sidebar-page-icon icon icon-circle-plus"></div>
							<div class="sidebar-page-name">시작하기</div>
						</a>
					</li>
					<li>
						<a
							id="sidebar-task"
							class="sidebar-page"
							th:href="@{/}"
							th:classappend="${currentPath == '/'} ? 'active'"
						>
							<div class="sidebar-page-icon icon icon-check-square"></div>
							<div class="sidebar-page-name">할 일</div>
						</a>
					</li>
					<li>
						<a
							id="sidebar-schedule"
							class="sidebar-page"
							th:href="@{/schedule}"
							th:classappend="${currentPath == '/schedule'} ? 'active'"
						>
							<div class="sidebar-page-icon icon icon-calendar"></div>
							<div class="sidebar-page-name">일정</div>
						</a>
					</li>
				</ul>
			</nav>
			<nav id="sidebar-projects" th:if="${sidebarMemberName != null}">
				<h2>내 프로젝트 <span class="icon icon-plus" aria-hidden="true"></span></h2>
				<ul>
					<li th:each="project: ${sidebarProjects}">
						<a
							class="sidebar-project"
							th:href="@{/project/{projectId}(projectId=${project.id})}"
							th:classappend="${currentPath == #strings.concat('/project/', project.id)} ? 'active'"
						>
							<div
								th:replace="~{fragments/project_icon :: projectIcon(${project.title}, 'sidebar-project-icon')}"
							></div>
							<div
								class="sidebar-project-name"
								th:text="${project.title}"
							></div>
						</a>
					</li>
				</ul>
			</nav>
			<nav id="sidebar-footer">
				<ul>
					<li id="sidebar-user">
						<a
							id="sidebar-userpage"
							th:if="${sidebarMemberName != null}"
							th:href="@{/profile/me}"
							th:classappend="${currentPath == '/profile/me'} ? 'active'"
						>
							<th:block
								th:replace="~{fragments/avatar :: avatar(${sidebarMemberProfileUrl}, ${sidebarMemberName}, 'sidebar-avatar')}"
							></th:block>
							<span
								class="sidebar-user-name"
								th:text="${sidebarMemberName}"
							></span>
						</a>
						<a
							id="sidebar-login"
							th:unless="${sidebarMemberName != null}"
							th:href="@{/login}"
							th:classappend="${currentPath == '/login'} ? 'active'"
							onclick="authSwitch('login');event.preventDefault();"
							>
							<div class="sidebar-login-icon"></div>
							<span>로그인</span>
						</a>
						<input
							id="sidebar-usermenu-toggle-input"
							class="toggle-input"
							type="checkbox"
						/>
						<label
							id="sidebar-usermenu-toggle-button"
							class="toggle-button icon icon-chevron-down"
							for="sidebar-usermenu-toggle-input"
						></label>
						<nav id="sidebar-usermenu">
							<ul>
								<li th:unless="${sidebarMemberName != null}">
									<a
										id="sidebar-register"
										th:href="@{/register}"
										onclick="authSwitch('register');event.preventDefault();"
									>
										<div class="sidebar-usermenu-icon icon icon-user-plus"></div>
										<div class="sidebar-usermenu-label">회원가입</div>
									</a>
								</li>
								<li th:if="${sidebarMemberName != null}">
									<form th:action="@{/logout}" method="POST">
										<button id="sidebar-logout" type="submit">
											<div class="sidebar-usermenu-icon icon icon-log-out"></div>
											<div class="sidebar-usermenu-label">
												로그아웃
											</div>
										</button>
									</form>
								</li>
							</ul>
						</nav>
					</li>
				</ul>
			</nav>
			<dialog th:if="${sidebarMemberName != null}" th:replace="~{auth :: modal}"></dialog>
		</header>
		<main>
			<h1>본문</h1>
		</main>
	</body>
</html>
