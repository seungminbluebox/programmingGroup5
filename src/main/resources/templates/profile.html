<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>프로필 - Azit</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/css/common.css" />
		<link rel="stylesheet" href="/css/sidebar.css" />
		<link rel="stylesheet" href="/css/profile.css" />
	</head>
	<body>
		<div th:replace="~{fragments/sidebar :: sidebar}"></div>

		<main class="profile-page">
			<!-- ── Profile Header Card ── -->
			<section class="card profile-header">
				<!-- Avatar -->
				<img
					th:if="${member.profileUrl != null}"
					th:src="${member.profileUrl}"
					class="profile-avatar"
					alt="프로필 사진"
				/>
				<div
					th:unless="${member.profileUrl != null}"
					class="profile-avatar profile-avatar-initials"
					aria-hidden="true"
				>
					<span th:text="${#strings.substring(member.name, 0, 1)}">U</span>
				</div>

				<!-- Info -->
				<div class="profile-info">
					<div class="profile-title-row">
						<h1 class="profile-name" th:text="${member.name}">User Name</h1>
						<span class="chip chip-green">탐색중</span>
					</div>
					<p class="profile-bio" th:text="${member.bio}">
						Short bio goes here...
					</p>
					<div class="profile-meta">
						<span class="profile-meta-item">
							<span class="icon icon-mail" aria-hidden="true"></span>
							<span th:text="${member.email}">email@example.com</span>
						</span>
						<!-- <span class="profile-meta-item" th:if="${member.age != null}">
							<span class="icon icon-user" aria-hidden="true"></span>
							<span th:text="${member.age + '세'}">25세</span>
						</span> -->
					</div>
				</div>

				<!-- Edit button (owner only) -->
				<div th:if="${isOwnProfile}">
					<button id="editBtn" class="btn btn-outline" onclick="toggleEdit()">
						<span class="icon icon-pencil" aria-hidden="true"></span>
						프로필 수정
					</button>
				</div>
			</section>

			<!-- ── View Mode ── -->
			<section id="viewMode">
				<!-- Tech Stack Card -->
				<section class="card" style="margin-bottom: var(--space-lg)">
					<div class="card-header">
						<span class="card-title">
							<span class="icon icon-code-2" aria-hidden="true"></span>
							기술 스택
						</span>
						<button
							th:if="${isOwnProfile}"
							class="btn btn-ghost btn-sm"
							onclick="toggleEdit()"
						>
							<span class="icon icon-square-pen" aria-hidden="true"></span>
							수정
						</button>
					</div>
					<div class="card-body">
						<div class="stack-chips">
							<span
								th:each="ms : ${member.memberStacks}"
								class="stack-chip"
							>
								<img
									th:if="${ms.techStack.iconUrl != null}"
									th:src="${ms.techStack.iconUrl}"
									alt=""
								/>
								<span th:text="${ms.techStack.stackName}">Java</span>
							</span>
						</div>
						<p
							th:if="${#lists.isEmpty(member.memberStacks)}"
							class="empty-state"
						>
							선택된 기술 스택이 없습니다.
						</p>
					</div>
				</section>

				<!-- Career Card -->
				<section class="card" style="margin-bottom: var(--space-lg)">
					<div class="card-header">
						<span class="card-title">
							<span class="icon icon-folder" aria-hidden="true"></span>
							프로젝트 경험
						</span>
						<button
							th:if="${isOwnProfile}"
							class="btn btn-ghost btn-sm"
							onclick="toggleEdit()"
						>
							<span class="icon icon-square-pen" aria-hidden="true"></span>
							수정
						</button>
					</div>
					<div class="career-list" th:if="${!#lists.isEmpty(member.careers)}">
						<div th:each="career : ${member.careers}" class="career-row">
							<div class="career-icon">
								<span class="icon icon-folder" aria-hidden="true"></span>
							</div>
							<div class="career-info">
								<div class="career-title" th:text="${career.title}">
									Project Title
								</div>
								<div class="career-desc" th:text="${career.description}">
									Description
								</div>
							</div>
							<a
								th:if="${career.linkUrl != null and career.linkUrl != ''}"
								th:href="${career.linkUrl}"
								target="_blank"
								class="btn btn-ghost btn-sm career-link"
								>링크 →</a
							>
						</div>
					</div>
					<div class="card-body" th:if="${#lists.isEmpty(member.careers)}">
						<p class="empty-state">등록된 경력이 없습니다.</p>
					</div>
				</section>
			</section>

			<!-- ── Edit Mode (Owner Only) ── -->
			<section id="editMode" class="edit-mode" th:if="${isOwnProfile}">
				<form
					th:action="@{/profile/update}"
					method="post"
					enctype="multipart/form-data"
					class="card edit-form"
				>
					<!-- Profile Image -->
					<div>
						<span class="label">프로필 사진</span>
						<div class="image-preview-wrap">
							<img
								id="profileImagePreview"
								th:src="${member.profileUrl != null ? member.profileUrl : 'https://via.placeholder.com/100'}"
								th:attr="data-original-src=${member.profileUrl != null ? member.profileUrl : 'https://via.placeholder.com/100'}"
								class="image-preview"
								alt="프로필 미리보기"
							/>
							<input
								id="profileImageInput"
								type="file"
								name="profileImage"
								class="input"
								style="max-width: 360px"
								accept="image/*"
							/>
							<small class="text-muted"
								>5MB 이하의 이미지를 선택하세요.</small
							>
							<div id="profileImageError" class="field-error"></div>
						</div>
					</div>

					<!-- Name & Age -->
					<div class="form-row">
						<div class="form-col">
							<label class="label" for="edit-name">이름</label>
							<input
								id="edit-name"
								type="text"
								name="name"
								class="input"
								th:value="${member.name}"
							/>
						</div>
						<div class="form-col">
							<label class="label" for="edit-age">나이</label>
							<input
								id="edit-age"
								type="number"
								name="age"
								class="input"
								th:value="${member.age}"
							/>
						</div>
					</div>

					<!-- Bio -->
					<div>
						<label class="label" for="edit-bio">자기소개</label>
						<textarea
							id="edit-bio"
							name="bio"
							class="input"
							rows="3"
							th:text="${member.bio}"
						></textarea>
					</div>

					<!-- Tech Stack -->
					<div>
						<span class="label">기술 스택</span>
						<div class="form-section">
							<div class="checkbox-group">
								<div th:each="stack : ${allStacks}" class="checkbox-item">
									<input
										type="checkbox"
										name="stackIds"
										th:value="${stack.id}"
										th:id="${'stack-' + stack.id}"
										th:checked="${selectedStackIds != null && #lists.contains(selectedStackIds, stack.id)}"
									/>
									<label
										th:for="${'stack-' + stack.id}"
										th:text="${stack.stackName}"
										>Java</label
									>
								</div>
							</div>
						</div>
					</div>

					<!-- Careers -->
					<div>
						<span class="label">경력 및 프로젝트</span>
						<div id="careerContainer" class="form-section">
							<div
								th:each="career, stat : ${member.careers}"
								class="dynamic-row"
							>
								<div class="dynamic-row-fields">
									<input
										type="text"
										name="careerTitle"
										class="input"
										placeholder="타이틀 / 회사명"
										th:value="${career.title}"
										required
									/>
									<input
										type="text"
										name="careerDesc"
										class="input"
										placeholder="설명 / 역할"
										th:value="${career.description}"
									/>
									<input
										type="url"
										name="careerLink"
										class="input"
										placeholder="URL (선택)"
										th:value="${career.linkUrl}"
									/>
								</div>
								<button
									type="button"
									class="btn btn-danger btn-sm"
									onclick="this.closest('.dynamic-row').remove()"
								>
									삭제
								</button>
							</div>
						</div>
						<button
							type="button"
							class="btn btn-outline btn-sm"
							style="margin-top: var(--space-2xs)"
							onclick="addCareer()"
						>
							+ 경력 추가
						</button>
					</div>

					<!-- Form Actions -->
					<div class="form-actions">
						<button
							type="button"
							class="btn btn-outline"
							onclick="toggleEdit()"
						>
							취소
						</button>
						<button type="submit" class="btn btn-primary">저장</button>
					</div>
				</form>
			</section>
			<!-- /editMode -->
		</main>
		<!-- /profile-page -->

		<script>
			let activeProfilePreviewUrl = null;
			const maxProfileImageSize = 5 * 1024 * 1024;

			function toggleEdit() {
				const viewMode = document.getElementById('viewMode');
				const editMode = document.getElementById('editMode');
				const editBtn = document.getElementById('editBtn');

				if (editMode.style.display === 'none' || editMode.style.display === '') {
					editMode.style.display = 'block';
					viewMode.style.display = 'none';
					if (editBtn) editBtn.textContent = '프로필 보기';
				} else {
					editMode.style.display = 'none';
					viewMode.style.display = 'block';
					if (editBtn) editBtn.textContent = '프로필 수정';
					resetProfileImagePreview();
				}
			}

			function resetProfileImagePreview() {
				const imageInput = document.getElementById('profileImageInput');
				const imagePreview = document.getElementById('profileImagePreview');
				const imageError = document.getElementById('profileImageError');
				if (!imageInput || !imagePreview) return;

				if (activeProfilePreviewUrl) {
					URL.revokeObjectURL(activeProfilePreviewUrl);
					activeProfilePreviewUrl = null;
				}

				imageInput.value = '';
				imagePreview.src = imagePreview.dataset.originalSrc;
				if (imageError) imageError.textContent = '';
			}

			function setupProfileImagePreview() {
				const imageInput = document.getElementById('profileImageInput');
				const imagePreview = document.getElementById('profileImagePreview');
				const imageError = document.getElementById('profileImageError');
				if (!imageInput || !imagePreview) return;

				imageInput.addEventListener('change', () => {
					const selectedFile = imageInput.files && imageInput.files[0];
					if (!selectedFile) {
						resetProfileImagePreview();
						return;
					}

					if (selectedFile.size > maxProfileImageSize) {
						resetProfileImagePreview();
						if (imageError)
							imageError.textContent =
								'프로필 이미지는 5MB 이하여야 합니다.';
						return;
					}

					if (!selectedFile.type.startsWith('image/')) {
						resetProfileImagePreview();
						if (imageError)
							imageError.textContent = '이미지 파일을 선택하세요.';
						return;
					}

					if (activeProfilePreviewUrl)
						URL.revokeObjectURL(activeProfilePreviewUrl);
					activeProfilePreviewUrl = URL.createObjectURL(selectedFile);
					imagePreview.src = activeProfilePreviewUrl;
					if (imageError) imageError.textContent = '';
				});
			}

			function addCareer() {
				const container = document.getElementById('careerContainer');
				const row = document.createElement('div');
				row.className = 'dynamic-row';
				row.innerHTML = `
					<div class="dynamic-row-fields">
						<input type="text" name="careerTitle" class="input" placeholder="타이틀 / 회사명" required />
						<input type="text" name="careerDesc" class="input" placeholder="설명 / 역할" />
						<input type="url" name="careerLink" class="input" placeholder="URL (선택)" />
					</div>
					<button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.dynamic-row').remove()">삭제</button>
				`;
				container.appendChild(row);
			}

			function addAvailability() {
				const container = document.getElementById('availContainer');
				const row = document.createElement('div');
				row.className = 'dynamic-row';
				row.innerHTML = `
					<div class="dynamic-row-fields">
						<select name="availDay" class="input">
							<option value="MON">Monday</option>
							<option value="TUE">Tuesday</option>
							<option value="WED">Wednesday</option>
							<option value="THU">Thursday</option>
							<option value="FRI">Friday</option>
							<option value="SAT">Saturday</option>
							<option value="SUN">Sunday</option>
						</select>
						<input type="time" name="availStart" class="input" required />
						<input type="time" name="availEnd" class="input" required />
					</div>
					<button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.dynamic-row').remove()">삭제</button>
				`;
				container.appendChild(row);
			}

			setupProfileImagePreview();
		</script>
	</body>
</html>
