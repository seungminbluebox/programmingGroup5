<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>로그인 - AZIT</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" th:href="@{/css/common.css}" />
		<link rel="stylesheet" th:href="@{/css/auth.css}" />
	</head>
	<body>
		<a class="logo" th:href="@{/}">AZIT</a>
		<!-- <section class="auth-hero">
				<p class="auth-hero-title">프로필과 팀 매칭을 이어서 관리하세요</p>
				<p class="auth-hero-content">
					로그인하면 내 기술 스택, 경력, 가능 시간대를 업데이트하고 팀원들이
					확인할 수 있는 프로필을 관리할 수 있습니다.
				</p>
			</section> -->

		<dialog id="modal-auth" class="auth-form-wrap card auth-card" open>
			<h2 class="auth-card-title">로그인</h2>
			<p class="auth-card-hint">AZIT 계정으로 계속 진행합니다.</p>
			<form th:action="@{/login}" method="post">
				<div class="form-group">
					<label class="label" for="username">이메일</label>
					<input
						class="input"
						type="email"
						id="username"
						name="username"
						placeholder="example@email.com"
						required
					/>
				</div>
				<div class="form-group">
					<label class="label" for="password">비밀번호</label>
					<input
						class="input"
						type="password"
						id="password"
						name="password"
						required
					/>
				</div>
				<button type="submit" class="btn btn-primary" style="width: 100%">
					로그인
				</button>
				<div th:if="${param.error}" class="auth-alert">
					로그인 정보가 올바르지 않습니다.
				</div>
			</form>
			<p class="auth-card-footer">
				아직 회원이 아니신가요?
				<a th:href="@{/register}">회원가입하기</a>
			</p>
		</dialog>
	</body>
</html>
