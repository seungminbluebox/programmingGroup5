<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>로그인 - AZIT</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" th:href="@{/css/common.css}" />
		<link rel="stylesheet" th:href="@{/css/auth.css}" />
	</head>
	<body>
		<a class="logo" th:unless="${isModal}" th:href="@{/}">AZIT</a>

		<dialog id="modal-auth" class="auth-form-wrap card auth-card modal"
				th:attr="open=${isModal} ? null : 'open'">
			<button type="button" class="modal-close"
					onclick="this.closest('dialog').close()" aria-label="닫기"><span class="modal-close-icon"></span></button>
			<h2 class="auth-card-title">로그인</h2>
			<p class="auth-card-hint">AZIT 계정으로 계속 진행합니다.</p>
			<form th:action="@{/login}" method="post">
				<div class="form-group">
					<label class="label" for="username">이메일</label>
					<input
						class="input"
						type="email"
						id="username"
						name="username"
						placeholder="example@email.com"
						required
					/>
				</div>
				<div class="form-group">
					<label class="label" for="password">비밀번호</label>
					<input
						class="input"
						type="password"
						id="password"
						name="password"
						required
					/>
				</div>
				<button type="submit" class="btn btn-primary" style="width: 100%">
					로그인
				</button>
				<div th:if="${param.error}" class="auth-alert">
					로그인 정보가 올바르지 않습니다.
				</div>
			</form>
			<p class="auth-card-footer">
				아직 회원이 아니신가요?
				<a th:href="@{/register}">회원가입하기</a>
			</p>
		</dialog>
	</body>
</html>
