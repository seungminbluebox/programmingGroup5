<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>로그인 - Azit</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/css/azit.css" />
	</head>
	<body class="azit-app">
		<main class="azit-auth-page">
			<section class="azit-auth-side">
				<a class="azit-brand" href="/">
					<span class="azit-brand-mark">AZ</span>
					<span>Azit</span>
				</a>
				<div style="margin-top: 56px">
					<div class="azit-kicker">Member Login</div>
					<h1>프로필과 팀 매칭을 이어서 관리하세요</h1>
					<p>
						로그인하면 내 기술 스택, 경력, 가능 시간대를 업데이트하고 팀원들이
						확인할 수 있는 프로필을 관리할 수 있습니다.
					</p>
				</div>
			</section>

			<section class="azit-auth-form-wrap">
				<div class="azit-panel azit-auth-card">
					<h2>로그인</h2>
					<p class="hint">Azit 계정으로 계속 진행합니다.</p>
					<form th:action="@{/login}" method="post">
						<div style="margin-bottom: 18px">
							<label class="azit-form-label" for="username">이메일</label>
							<input
								class="azit-input"
								type="email"
								id="username"
								name="username"
								placeholder="example@email.com"
								required
							/>
						</div>
						<div style="margin-bottom: 18px">
							<label class="azit-form-label" for="password">비밀번호</label>
							<input
								class="azit-input"
								type="password"
								id="password"
								name="password"
								required
							/>
						</div>
						<button type="submit" class="azit-button" style="width: 100%">
							로그인
						</button>
						<div
							th:if="${param.error}"
							class="azit-alert"
							style="margin-top: 16px"
						>
							로그인 정보가 올바르지 않습니다.
						</div>
					</form>
					<p
						style="
							margin: 24px 0 0;
							text-align: center;
							color: var(--azit-muted);
						"
					>
						아직 회원이 아니신가요?
						<a href="/register" style="font-weight: 800">회원가입하기</a>
					</p>
				</div>
			</section>
		</main>
	</body>
</html>
