<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/project_layout :: head}"></head>

<body>
  <div th:replace="~{fragments/sidebar :: sidebar}"></div>

  <main>
    <div class="project-detail-page">
      <div th:replace="~{fragments/project_layout :: header('overview')}"></div>

      <section class="project-detail-layout">
        <div class="project-detail-main">
          <article class="card project-detail-card">
            <div class="project-detail-card-heading">
              <div>
                <h2>현재 진행률</h2>
                <p>모든 완료 진행 상황</p>
              </div>
            </div>
            <div class="project-detail-deadline-chip" th:if="${project.deadline != null}">
              <span class="icon icon-clock-3" aria-hidden="true"></span>
              <div>
                <strong th:text="${deadlineRemainingDays} + '일 남음'">0일 남음</strong>
                <span th:text="${project.deadline}">2026-06-30</span>
              </div>
            </div>

            <div class="project-detail-progress-list">
              <div class="project-detail-progress-row">
                <div class="project-detail-progress-label">
                  <strong>나의 진행도</strong>
                  <span th:text="${myTaskCompletionRate} + '%'">0%</span>
                </div>
                <div class="progress">
                  <div class="progress-fill" th:style="'width: ' + ${myTaskCompletionRate} + '%'"></div>
                </div>
              </div>

              <div class="project-detail-progress-row">
                <div class="project-detail-progress-label">
                  <strong>팀 평균 진행도</strong>
                  <span th:text="${teamTaskCompletionRate} + '%'">0%</span>
                </div>
                <div class="progress">
                  <div class="progress-fill" th:style="'width: ' + ${teamTaskCompletionRate} + '%'"></div>
                </div>
              </div>

              <div class="project-detail-progress-row" th:if="${project.deadline != null}">
                <div class="project-detail-progress-label">
                  <strong>남은 기간</strong>
                  <span>
                    <span th:text="${deadlineRemainingRate} + '%'">0%</span>
                    <small th:text="'(' + ${deadlineRemainingDays} + '일 남음)'">(0일 남음)</small>
                  </span>
                </div>
                <div class="progress">
                  <div class="progress-fill deadline" th:style="'width: ' + (100 - ${deadlineRemainingRate}) + '%'"></div>
                </div>
              </div>
            </div>
          </article>

          <article class="card project-detail-card" th:if="${tasks != null and !tasks.isEmpty()}">
            <div class="project-detail-card-heading">
              <div>
                <h2>현재 할 일</h2>
                <p>
                  <span th:text="${incompleteTaskCount}">0</span>
                  개의 활성 작업
                </p>
              </div>
            </div>

            <div class="project-detail-overview-board">
              <div class="project-detail-task-lane project-detail-task-lane-progress">
                <div class="project-detail-lane-title">
                  <strong>진행 중</strong>
                  <span th:text="${incompleteTaskCount}">0</span>
                </div>

                <div class="project-detail-task-card compact" th:each="task : ${tasks}" th:if="${!task.completed}">
                  <div class="project-detail-task-content">
                    <span class="chip chip-purple">진행</span>
                    <strong th:text="${task.title}">태스크 제목</strong>
                    <p th:text="${task.assignee.name}">담당자 이름</p>
                  </div>
                </div>
              </div>

              <div class="project-detail-task-lane project-detail-task-lane-done">
                <div class="project-detail-lane-title">
                  <strong>완료</strong>
                  <span th:text="${myCompletedTaskCount}">0</span>
                </div>

                <div class="project-detail-task-card compact completed" th:each="task : ${tasks}"
                  th:if="${task.completed}">
                  <div class="project-detail-task-content">
                    <span class="chip chip-green">완료됨</span>
                    <strong th:text="${task.title}">완료한 태스크</strong>
                    <p th:text="${task.assignee.name}">담당자 이름</p>
                  </div>
                </div>
              </div>
            </div>
          </article>
        </div>

        <aside class="project-detail-side">
          <article class="card project-detail-card project-detail-availability-card"
            th:if="${topAvailableSlots != null and !topAvailableSlots.isEmpty()}">
            <div class="project-detail-card-heading">
              <div>
                <h2>만날 수 있는 시간</h2>
                <p>팀원이 함께 가능한 시간</p>
              </div>
              <span class="project-detail-bolt icon icon-zap" aria-hidden="true"></span>
            </div>

            <th:block th:replace="~{project_schedule :: topSlots(${topAvailableSlots}, 3)}"></th:block>

            <a class="btn btn-outline project-detail-wide-button"
              th:href="@{/project/{projectId}/schedule(projectId=${project.id})}">
              일정 확인하기
            </a>
          </article>

          <article class="card project-detail-card" th:if="${projectMembers != null and !projectMembers.isEmpty()}">
            <div class="project-detail-card-heading">
              <div>
                <h2>팀원</h2>
                <p th:text="${projectMembers.size()} + '명'">0명</p>
              </div>
            </div>

            <div class="project-detail-member-list">
              <div class="project-detail-member" th:each="projectMember : ${projectMembers}">
                <th:block
                  th:replace="~{fragments/avatar :: avatar(${projectMember.member.profileUrl}, ${projectMember.member.name}, 'project-detail-member-avatar')}">
                </th:block>

                <div>
                  <strong th:text="${projectMember.member.name}">팀원 이름</strong>
                  <p class="project-detail-member-email" th:text="${projectMember.role}">
                    MEMBER
                  </p>
                </div>
              </div>
            </div>

            <a class="btn btn-outline project-detail-wide-button"
              th:href="@{/project/{projectId}/member(projectId=${project.id})}">
              전체 팀원 보기
            </a>
          </article>
        </aside>
      </section>
    </div>
  </main>
</body>

</html>
