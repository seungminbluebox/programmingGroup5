<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${invitation.project.title} + ' 초대 | Azit'">초대 | Azit</title>
    <link rel="stylesheet" href="/css/azit.css" />
  </head>
  <body class="azit-app">
    <header class="azit-nav">
      <div class="azit-shell azit-nav-inner">
        <a class="azit-brand" href="/">
          <span class="azit-brand-mark">AZ</span>
          <span>Azit</span>
        </a>
        <div class="azit-nav-actions">
          <a href="/invitations" class="azit-button azit-button-secondary">초대 목록</a>
          <a href="/" class="azit-button azit-button-secondary">대시보드</a>
          <form th:action="@{/logout}" method="post">
            <button type="submit" class="azit-button azit-button-danger">로그아웃</button>
          </form>
        </div>
      </div>
    </header>

    <main class="azit-shell azit-page">
      <section class="azit-page-heading">
        <div>
          <div class="azit-kicker">Project Invitation</div>
          <h1 th:text="${invitation.project.title}">프로젝트 이름</h1>
          <p th:text="${invitation.project.description}">프로젝트 설명</p>
        </div>
      </section>

      <section class="azit-grid">
        <article class="azit-card">
          <div class="azit-card-header">프로젝트 정보</div>
          <div class="azit-card-body">
            <div class="azit-form-section" style="margin-bottom: 14px">
              <strong>초대한 사람</strong>
              <p class="azit-empty" style="margin-top: 6px">
                <span th:text="${invitation.sender.name}">이름</span>
                /
                <span th:text="${invitation.sender.email}">email@example.com</span>
              </p>
            </div>

            <div class="azit-form-section">
              <strong>현재 팀원</strong>

              <div
                th:if="${invitation.project.members != null and !invitation.project.members.isEmpty()}"
                style="display: grid; gap: 10px; margin-top: 12px"
              >
                <div th:each="projectMember : ${invitation.project.members}">
                  <span th:text="${projectMember.member.name}">팀원 이름</span>
                  <span class="azit-stack-badge" th:text="${projectMember.role}">OWNER</span>
                </div>
              </div>

              <p
                class="azit-empty"
                th:if="${invitation.project.members == null or invitation.project.members.isEmpty()}"
                style="margin-top: 10px"
              >
                아직 등록된 팀원이 없습니다.
              </p>
            </div>
          </div>
        </article>

        <aside class="azit-card">
          <div class="azit-card-header">초대 응답</div>
          <div class="azit-card-body">
            <p class="azit-empty" style="margin-bottom: 16px">
              프로젝트 정보를 확인한 뒤 초대를 수락하거나 거절할 수 있습니다.
            </p>

            <div style="display: flex; gap: 10px; flex-wrap: wrap">
              <form th:action="@{/invitations/{id}/accept(id=${invitation.id})}" method="post">
                <button type="submit" class="azit-button">초대 수락</button>
              </form>

              <form th:action="@{/invitations/{id}/reject(id=${invitation.id})}" method="post">
                <button type="submit" class="azit-button azit-button-danger">거절</button>
              </form>
            </div>
          </div>
        </aside>
      </section>
    </main>
  </body>
</html>
