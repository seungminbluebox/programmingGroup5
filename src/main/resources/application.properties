spring.config.import=optional:file:.env[.properties],optional:file:azit/.env[.properties]
spring.application.name=azit

# MySQL DataSource settings
spring.datasource.url=jdbc:mysql://${DB_URL:azit-database}:${DB_PORT:3306}/${DB_NAME:azit_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 인코딩 설정
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Respect proxy headers (e.g. Codespaces) when building redirect URLs.
server.forward-headers-strategy=framework

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
